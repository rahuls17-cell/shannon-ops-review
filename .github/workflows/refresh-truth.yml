name: Refresh derived pipeline
# Rebuilds assets/pipeline-truth.json from gs://obi-harbor-pipeline and deploys.
#
# The dashboard cannot read GCS itself, and the credentials live only on the
# Harbor VM, so the work happens there. This job asks the VM for the result over
# a key that is pinned to one script (tools/vm-export.sh) and can do nothing
# else - no shell, no forwarding, no arbitrary commands.
#
# The chain gates itself: if reconcile.py fails an invariant the VM exits
# non-zero and sends nothing, so this job cannot publish unreconciled figures.
on:
  workflow_dispatch:
  # The published page is static and cannot hold a credential, so it has no way
  # to start this job itself - the button used to hand the visitor a GitHub
  # Actions page to press Run on. Running on a schedule removes the need: the
  # derived pipeline refreshes itself and the button only has to look for newer
  # data. The concurrency group is shared with refresh-gcs, so the two still
  # never overlap, and the commit step is a no-op when nothing changed.
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: shannon-gcs-refresh      # shared with refresh-gcs so the two never overlap
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild on the VM and fetch the result
        env:
          SSH_KEY: ${{ secrets.SHANNON_REFRESH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SHANNON_REFRESH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/shannon
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/shannon' EXIT
          set -o pipefail
          # The runner reaches the VM over the open internet and that hop
          # drops occasionally - twice in two days, each time costing a whole
          # refresh. The VM was healthy both times: 32 cores at 14% load. So
          # three attempts with a backoff, which absorbs a blip while a real
          # outage still fails the run.
          fetch() {
            out=$1; arg=$2
            for attempt in 1 2 3; do
              if ssh -T -i ~/.ssh/shannon -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 root@35.253.35.165 "$arg" | gzip -d > "$out" && [ -s "$out" ]; then
                return 0
              fi
              echo "attempt $attempt: the VM could not be reached, or sent nothing"
              [ "$attempt" = 3 ] && return 1
              sleep $((attempt * 20))
            done
          }
          fetch assets/pipeline-truth.json.new truth

          # Refuse anything that does not carry its own passing reconciliation,
          # a partition over the states, and a chain on every figure.
          python3 - <<'CHECK'
          import json, pathlib, sys
          p = json.loads(pathlib.Path('assets/pipeline-truth.json.new').read_text(encoding='utf-8'))
          rows = p['tasks']
          if not p.get('reconciles'):
              sys.exit('asset did not pass its own reconciliation')
          if not rows:
              sys.exit('asset carries no rows')
          states = {}
          for r in rows:
              states[r['state']] = states.get(r['state'], 0) + 1
          if sum(states.values()) != len(rows):
              sys.exit('states do not partition the population')
          for f in p['figures']:
              counts = [s['count'] for s in f['steps']]
              if not counts or counts[-1] != f['value']:
                  sys.exit(f"figure {f['label']!r} has no chain ending at its value")
              if any(a < b for a, b in zip(counts, counts[1:])):
                  sys.exit(f"figure {f['label']!r} has a chain that grows")
          print(p['generatedAt'], len(rows), 'rows',
                {f['label']: f['value'] for f in p['figures'][:5]})
          CHECK
          mv assets/pipeline-truth.json.new assets/pipeline-truth.json

      - name: Rejoin the delivered index
        # The index maps delivered tasks onto pipeline task ids, so it has to be
        # rebuilt against the pipeline that was just produced. Reads two files
        # already in the repo; touches neither the bucket nor any credential.
        run: |
          python3 tools/build_delivered_index.py
          # Same reason as the delivered index: it resolves to pipeline
          # task ids, so a rebuilt pipeline leaves it describing the
          # wrong rows. Reads the published bucket scan; no credential.
          python3 tools/build_connector_index.py
          # Only the check that the index describes the data it was built from.
          # The behavioural suites moved to ci.yml: they assert how the page
          # reads this data, and when one of them was wrong about live data it
          # stopped the refresh for six hours. A publishing job should be gated
          # on whether the data is sound, not on whether a test is.
          python3 tools/test_delivered_join.py

      - name: Commit the rebuilt asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Regenerated wholesale, so there is nothing to merge: re-apply it on
          # top of origin/main rather than rebasing it onto a moved branch.
          cp assets/pipeline-truth.json "$RUNNER_TEMP/pipeline-truth.json"
          cp assets/delivered-index.json "$RUNNER_TEMP/delivered-index.json"
          cp assets/connector-index.json "$RUNNER_TEMP/connector-index.json"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/pipeline-truth.json" assets/pipeline-truth.json
            cp "$RUNNER_TEMP/delivered-index.json" assets/delivered-index.json
            cp "$RUNNER_TEMP/connector-index.json" assets/connector-index.json
            git add assets/pipeline-truth.json assets/delivered-index.json assets/connector-index.json
            if git diff --cached --quiet; then
              echo "asset is identical to main; nothing to commit"
              pushed=1
              break
            fi
            git commit -m "Refresh derived pipeline, delivered and connector indexes"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push raced with another commit; retrying ($attempt/3)"
          done
          if [ "$pushed" != 1 ]; then
            echo "could not push the rebuilt asset after 3 attempts"
            exit 1
          fi

      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # The list of scripts and stylesheets is read off index.html rather
          # than written out here. Two workflows each kept their own copy of it
          # and they drifted: manifest.js and delivery-audit.js were added to
          # one and not the other, so every run of the other one failed at the
          # check below. Deriving it means a new module is published because
          # the page references it, not because someone remembered.
          python3 - <<'COPY'
          import pathlib, re, shutil
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          site = pathlib.Path('_site')
          refs = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html)
          local = [r for r in dict.fromkeys(refs)
                   if not r.startswith(('http://', 'https://', '//', 'data:'))]
          for ref in local:
              target = site / ref
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(ref, target)
          print('published ' + str(len(local)) + ' referenced files: ' + ', '.join(local))
          COPY
          # Pages caches these, so a returning visitor would keep running the
          # previous build's JavaScript against the new data. Stamp every local
          # asset URL with the commit so each deploy is a fresh URL.
          python3 - <<'STAMP'
          import os, pathlib, re
          version = os.environ.get('GITHUB_SHA', 'dev')[:12]
          page = pathlib.Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          def bust(match):
              attr, url = match.group(1), match.group(2)
              if url.startswith(('http://', 'https://', '//', 'data:')) or '?' in url:
                  return match.group(0)
              return attr + '="' + url + '?v=' + version + '"'
          pattern = re.compile(r'(src|href)="([^"]+\.(?:js|css))"')
          html, n = pattern.subn(bust, html)
          page.write_text(html, encoding='utf-8')
          print('stamped ' + str(n) + ' local asset URLs with v=' + version)
          STAMP
          # Fail the deploy rather than publish a page whose scripts 404.
          python3 - <<'GUARD'
          import re, sys, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          missing = [src for src in re.findall(r'<script src="([^"]+)"', html)
                     if not (pathlib.Path('_site') / src).exists()]
          if missing:
              sys.exit('not published but referenced by index.html: ' + ', '.join(missing))
          print('all scripts referenced by index.html are present in _site')
          GUARD

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # A failed refresh used to be silent - the ones this week were found only
      # because someone went looking. This raises one issue and keeps commenting
      # on it, so a run of failures is a single thread rather than a stack of
      # duplicates, and closes it when a refresh next works.
      - name: Say so if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: refresh-broken
        run: |
          gh label create "$LABEL" --color B60205 --description "A scheduled data refresh is failing" || true
          open_issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "Failed again: [Refresh derived pipeline]($RUN_URL)"
            echo "commented on issue #$open_issue"
          else
            body=$(printf '%s\n' \
              "The scheduled refresh failed, so the published data is no longer being updated." \
              "" \
              "Latest run: $RUN_URL" \
              "" \
              "This issue collects a comment per failure and closes itself when a refresh succeeds." \
              "The dashboard states the age of the data it is showing, so a stale page says so too.")
            gh issue create --label "$LABEL" --title "Refresh derived pipeline is failing" --body "$body"
          fi

      - name: Close the failure notice once it works again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: refresh-broken
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Refreshing again: [this run]($RUN_URL) succeeded."
            echo "closed issue #$number"
          done
