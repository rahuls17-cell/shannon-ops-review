name: Refresh GCS pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: shannon-gcs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read GCS through the VM
        env:
          SSH_KEY: ${{ secrets.SHANNON_REFRESH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SHANNON_REFRESH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/shannon
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/shannon' EXIT
          ssh -T -i ~/.ssh/shannon -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 root@35.253.35.165 export | gzip -d > assets/gcs-pipeline.json.new
          python3 -c 'import json; p=json.load(open("assets/gcs-pipeline.json.new")); assert p["schemaVersion"] == 2; assert all(isinstance(p[k], list) and p[k] for k in ("current", "historical", "legacy")); print(p["generatedAt"], {k:len(p[k]) for k in ("current","historical","legacy")})'
          mv assets/gcs-pipeline.json.new assets/gcs-pipeline.json
          python3 -c 'import json; p=json.load(open("assets/gcs-pipeline.json")); json.dump({"generatedAt":p["generatedAt"]},open("assets/pipeline-version.json","w"))'
      - name: Commit refreshed snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/gcs-pipeline.json assets/pipeline-version.json
          git diff --cached --quiet || git commit -m "Refresh GCS pipeline snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html app.js styles.css finalisation.js accepted-tasks.js _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
