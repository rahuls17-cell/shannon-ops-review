name: Refresh GCS pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: shannon-gcs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Read GCS through the VM
        env:
          SSH_KEY: ${{ secrets.SHANNON_REFRESH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SHANNON_REFRESH_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/shannon
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/shannon' EXIT
          set -o pipefail
          # The runner reaches the VM over the open internet and that hop
          # drops occasionally - twice in two days, each time costing a whole
          # refresh. The VM was healthy both times: 32 cores at 14% load. So
          # three attempts with a backoff, which absorbs a blip while a real
          # outage still fails the run.
          fetch() {
            out=$1; arg=$2
            for attempt in 1 2 3; do
              if ssh -T -i ~/.ssh/shannon -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 root@35.253.35.165 "$arg" | gzip -d > "$out" && [ -s "$out" ]; then
                return 0
              fi
              echo "attempt $attempt: the VM could not be reached, or sent nothing"
              [ "$attempt" = 3 ] && return 1
              sleep $((attempt * 20))
            done
          }
          fetch assets/gcs-pipeline.json.new export
          python3 -c 'import json; p=json.load(open("assets/gcs-pipeline.json.new")); assert p["schemaVersion"] == 3; assert p["finalisation"]["tasks"]; assert all(isinstance(p[k], list) and p[k] for k in ("current", "historical", "legacy")); print(p["generatedAt"], {k:len(p[k]) for k in ("current","historical","legacy")}, p["finalisation"]["totals"])'
          mv assets/gcs-pipeline.json.new assets/gcs-pipeline.json
          python3 -c 'import json; p=json.load(open("assets/gcs-pipeline.json")); json.dump({"generatedAt":p["generatedAt"]},open("assets/pipeline-version.json","w"))'
          # The connector classification is read from this scan, so a fresh
          # scan can classify tasks the previous one could not. Rebuilt here
          # as well as in refresh-truth, because either input moving makes it
          # stale. Skipped when the pipeline asset is not present yet.
          if [ -f assets/pipeline-truth.json ]; then
            python3 tools/build_connector_index.py
          fi
      - name: Commit refreshed snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # The snapshot is regenerated wholesale each run, so there is nothing
          # to merge - rebasing it onto a main that moved during the walk just
          # conflicts on every line. Re-apply it on top of origin/main instead,
          # and retry if someone pushes while we are pushing.
          cp assets/gcs-pipeline.json "$RUNNER_TEMP/gcs-pipeline.json"
          cp assets/pipeline-version.json "$RUNNER_TEMP/pipeline-version.json"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/gcs-pipeline.json" assets/gcs-pipeline.json
            cp "$RUNNER_TEMP/pipeline-version.json" assets/pipeline-version.json
            git add assets/gcs-pipeline.json assets/pipeline-version.json assets/connector-index.json
            if git diff --cached --quiet; then
              echo "snapshot is identical to main; nothing to commit"
              pushed=1
              break
            fi
            git commit -m "Refresh GCS pipeline snapshot and connector index"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push raced with another commit; retrying ($attempt/3)"
          done
          if [ "$pushed" != 1 ]; then
            echo "could not push the snapshot after 3 attempts"
            exit 1
          fi
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # The list of scripts and stylesheets is read off index.html rather
          # than written out here. Two workflows each kept their own copy of it
          # and they drifted: manifest.js and delivery-audit.js were added to
          # one and not the other, so every run of the other one failed at the
          # check below. Deriving it means a new module is published because
          # the page references it, not because someone remembered.
          python3 - <<'COPY'
          import pathlib, re, shutil
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          site = pathlib.Path('_site')
          refs = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html)
          local = [r for r in dict.fromkeys(refs)
                   if not r.startswith(('http://', 'https://', '//', 'data:'))]
          for ref in local:
              target = site / ref
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(ref, target)
          print('published ' + str(len(local)) + ' referenced files: ' + ', '.join(local))
          COPY
          # Pages serves these with a long cache, so a returning visitor keeps
          # running the previous build's JS against the new data - which is how
          # an already-fixed chart still rendered empty. Stamp every local asset
          # URL with the commit so each deploy is a new URL.
          python3 - <<'STAMP'
          import os, pathlib, re
          version = os.environ.get('GITHUB_SHA', 'dev')[:12]
          page = pathlib.Path('_site/index.html')
          html = page.read_text(encoding='utf-8')
          def bust(match):
              attr, url = match.group(1), match.group(2)
              if url.startswith(('http://', 'https://', '//', 'data:')) or '?' in url:
                  return match.group(0)
              return attr + '="' + url + '?v=' + version + '"'
          pattern = re.compile(r'(src|href)="([^"]+\.(?:js|css))"')
          html, n = pattern.subn(bust, html)
          page.write_text(html, encoding='utf-8')
          print('stamped ' + str(n) + ' local asset URLs with v=' + version)
          STAMP
          # Fail the deploy rather than publish a page whose scripts 404.
          python3 - <<'CHECK'
          import re, sys, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          missing = [src for src in re.findall(r'<script src="([^"]+)"', html)
                     if not (pathlib.Path('_site') / src).exists()]
          if missing:
              sys.exit('not published but referenced by index.html: ' + ', '.join(missing))
          print('all scripts referenced by index.html are present in _site')
          CHECK
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

      # A failed refresh used to be silent - the ones this week were found only
      # because someone went looking. This raises one issue and keeps commenting
      # on it, so a run of failures is a single thread rather than a stack of
      # duplicates, and closes it when a refresh next works.
      - name: Say so if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: refresh-broken
        run: |
          gh label create "$LABEL" --color B60205 --description "A scheduled data refresh is failing" || true
          open_issue=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "Failed again: [Refresh GCS pipeline]($RUN_URL)"
            echo "commented on issue #$open_issue"
          else
            body=$(printf '%s\n' \
              "The scheduled refresh failed, so the published data is no longer being updated." \
              "" \
              "Latest run: $RUN_URL" \
              "" \
              "This issue collects a comment per failure and closes itself when a refresh succeeds." \
              "The dashboard states the age of the data it is showing, so a stale page says so too.")
            gh issue create --label "$LABEL" --title "Refresh GCS pipeline is failing" --body "$body"
          fi

      - name: Close the failure notice once it works again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: refresh-broken
        run: |
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Refreshing again: [this run]($RUN_URL) succeeded."
            echo "closed issue #$number"
          done
